name: ETL Pipeline

on:
    push:
        branches:
            - main

jobs:
    extract-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: run python program
              run: python extract.py

    transform-job:
        needs: extract-job
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: run python program
              run: python transform.py

    load-job:
        needs: transform-job
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: run python program
              run: python load.py